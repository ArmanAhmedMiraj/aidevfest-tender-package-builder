<!doctype html>
<html lang="en" data-theme="modern">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tender Document Package Builder</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/preview.css"><link rel="stylesheet" href="css/polish.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip"></a>
<header class="top">
  <div class="brand">
    <h1 data-i18n="app_title">Tender Document Package Builder</h1>
    <p class="sub" data-i18n="app_sub"></p>
  </div>
  <div class="tools">
    <div class="seg" role="group" aria-labelledby="th-label">
      <span id="th-label" class="seg-label" data-i18n="th_label"></span>
      <button type="button" data-theme-btn="modern" aria-pressed="true" data-i18n="th_modern"></button>
      <button type="button" data-theme-btn="contrast" aria-pressed="false" data-i18n="th_contrast"></button>
    </div>
    <div class="lang seg" role="group" aria-label="Language / &#2477;&#2494;&#2487;&#2494;">
      <button type="button" id="lang-en" aria-pressed="true">English</button>
      <button type="button" id="lang-bn" aria-pressed="false">&#2476;&#2494;&#2434;&#2482;&#2494;</button>
    </div>
  </div>
</header>
<nav class="steps" aria-label="Steps / &#2471;&#2494;&#2474;&#2488;&#2478;&#2498;&#2489;">
  <a href="#s1"><b>1</b><span data-i18n="nav_1"></span></a>
  <a href="#s2"><b>2</b><span data-i18n="nav_2"></span></a>
  <a href="#s3"><b>3</b><span data-i18n="nav_3"></span></a>
  <a href="#s4"><b>4</b><span data-i18n="nav_4"></span></a>
</nav>

<main id="main">
  <div id="messages" aria-live="polite"></div>

  <section class="card c1" id="s1">
    <h2 data-i18n="step1"></h2>
    <p class="hint" data-i18n="step1_hint"></p>
    <input type="file" id="json-input" hidden>
    <button type="button" id="btn-json" class="btn primary" data-i18n="btn_choose_json"></button>
    <dl id="tender-details" class="details"></dl>
  </section>

  <section class="card c2" id="s2">
    <h2 data-i18n="step2"></h2>
    <p class="hint" data-i18n="step2_hint"></p>
    <input type="file" id="pdf-input" multiple hidden>
    <div id="dropzone" class="dropzone">
      <button type="button" id="btn-pdfs" class="btn primary" data-i18n="btn_choose_pdfs"></button>
      <span class="drop-text" data-i18n="drop_here"></span>
    </div>
    <ul id="file-list" class="files"></ul>
  </section>

  <section class="card c3" id="s3">
    <h2 data-i18n="step3"></h2>
    <p class="hint" data-i18n="step3_hint"></p>
    <div id="req-wrap" class="req-wrap"></div>
  </section>

  <section class="card c4" id="s4">
    <h2 data-i18n="step4"></h2>
    <div id="gen-reasons"></div>
    <button type="button" id="btn-generate" class="btn primary big" disabled data-i18n="btn_generate"></button>
  </section>
</main>

<script src="libs/pdf-lib.min.js"></script>
<script src="js/logic.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n-extra.js"></script><script src="js/theme.js"></script><script src="js/preview.js"></script><script src="js/polish.js"></script><script src="js/bn-more.js"></script><script src="js/pdf.js"></script><script src="js/app.js"></script>
</body>
</html>
